
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      margin: 0;
      padding: 20px;
      font: 13px Inter, sans-serif;
      color: var(--figma-color-text, #222);
      background: var(--figma-color-bg, #fff);
    }

    h2 {
      margin: 0 0 20px;
      font-size: 16px;
    }

    label {
      display: block;
      margin-bottom: 6px;
    }

    select {
      width: 100%;
      padding: 8px;
      margin-bottom: 16px;
      border: 1px solid var(--figma-color-border, #ddd);
      border-radius: 6px;
      background: var(--figma-color-bg, #fff);
      color: inherit;
    }

    input[type="file"] {
      width: 100%;
      margin-bottom: 16px;
      color: inherit;
    }

    button {
      width: 100%;
      padding: 10px;
      border: 0;
      border-radius: 6px;
      background: var(--figma-color-bg-brand, #0d99ff);
      color: var(--figma-color-text-onbrand, #fff);
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: default;
    }

    #status {
      margin-top: 14px;
      color: var(--figma-color-text-secondary, #777);
    }
  </style>
</head>
<body>
  <h2>Illustration Composer</h2>

  <label for="primary">Основной объект</label>
  <select id="primary"></select>

  <label for="secondary">Дополнительный объект</label>
  <select id="secondary"></select>

  <label for="layout">Тип композиции</label>
  <select id="layout">
    <option value="focus">Focus — с акцентом</option>
    <option value="row">Row — в ряд</option>
  </select>

  <label for="format">Формат холста</label>
  <select id="format">
    <option value="landscape">Горизонтальный — 1200 × 800</option>
    <option value="square">Квадратный — 1000 × 1000</option>
    <option value="portrait">Вертикальный — 800 × 1200</option>
  </select>

  <label for="palette">Цветовая палитра</label>
  <select id="palette">
    <option value="original">Фиолетовая</option>
    <option value="mint">Мятная</option>
    <option value="peach">Персиковая</option>
  </select>

  <label for="palette-file">Загрузить свою палитру (JSON)</label>
  <input
    id="palette-file"
    type="file"
    accept=".json,application/json"
  >

  <button id="create" disabled>
    Создать композицию
  </button>

  <p id="status">Загрузка каталога...</p>

  <script>
    const primary = document.getElementById("primary");
    const secondary = document.getElementById("secondary");
    const layout = document.getElementById("layout");
    const format = document.getElementById("format");
    const palette = document.getElementById("palette");
    const paletteFile = document.getElementById("palette-file");
    const button = document.getElementById("create");
    const statusElement = document.getElementById("status");

    let customPalette = null;

    function fillSelect(select, assets) {
      select.replaceChildren();

      for (const asset of assets) {
        const option = document.createElement("option");

        option.value = asset.id;
        option.textContent = asset.name;

        select.appendChild(option);
      }
    }

    paletteFile.onchange = async () => {
      const file = paletteFile.files[0];

      if (!file) {
        return;
      }

      try {
        if (file.size > 16384) {
          throw new Error("Файл палитры слишком большой");
        }

        const data = JSON.parse(await file.text());

        if (
          !data ||
          typeof data !== "object" ||
          Array.isArray(data) ||
          typeof data.name !== "string" ||
          !data.name.trim()
        ) {
          throw new Error("Некорректный файл палитры");
        }

        const previousOption = palette.querySelector(
          'option[value="custom"]'
        );

        if (previousOption) {
          previousOption.remove();
        }

        const option = document.createElement("option");
        option.value = "custom";
        option.textContent = data.name;

        palette.appendChild(option);

        customPalette = data;
        palette.value = "custom";

        statusElement.textContent = "Палитра загружена";
      } catch (error) {
        customPalette = null;
        palette.value = "original";

        statusElement.textContent = error instanceof Error
          ? error.message
          : String(error);
      }
    };

    button.onclick = () => {
      if (!primary.value || !secondary.value) {
        return;
      }

      button.disabled = true;
      statusElement.textContent = "Создаём композицию...";

      parent.postMessage({
        pluginMessage: {
          type: "create",
          primaryId: primary.value,
          secondaryId: secondary.value,
          layout: layout.value,
          format: format.value,
          palette: palette.value === "custom"
            ? customPalette
            : palette.value
        }
      }, "*");
    };

    window.onmessage = event => {
      const message = event.data.pluginMessage;

      if (!message) {
        return;
      }

      if (message.type === "ready") {
        fillSelect(primary, message.assets);
        fillSelect(secondary, message.assets);

        primary.value = "wallet";
        secondary.value = "coin";

        if (!primary.value) {
          primary.selectedIndex = 0;
        }

        if (!secondary.value) {
          secondary.selectedIndex = 0;
        }

        button.disabled = !primary.value || !secondary.value;

        statusElement.textContent =
          `Доступно объектов: ${message.assets.length}`;
      }

      if (message.type === "created") {
        button.disabled = false;
        statusElement.textContent = "Композиция создана";
      }

      if (message.type === "error") {
        button.disabled = false;
        statusElement.textContent = message.message;
      }
    };
  </script>
</body>
</html>
